name: Reusable build

on:
  workflow_call:
    inputs:
      goreleaser_options:
        description: GoReleaser options separated by spaces
        default: ''
        required: false
        type: string
      release_notes_from_changelog:
        description: Extract release notes for the current tag from CHANGELOG.md
        default: false
        required: false
        type: boolean

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true
      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610
        with:
          syft-version: v1.17.0
      - name: Extract release notes
        if: inputs.release_notes_from_changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          awk -v heading="## [${version}]" \
            'index($0, heading) == 1 { found = 1; next } /^## / && found { exit } found' \
            CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --config .goreleaser/goreleaser.yml ${{ inputs.goreleaser_options }} ${{ contains(inputs.goreleaser_options, '--snapshot') && '--skip=sign' || '' }} ${{ inputs.release_notes_from_changelog && format('--release-notes {0}/release-notes.md', runner.temp) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
