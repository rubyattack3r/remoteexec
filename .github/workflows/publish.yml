name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  docs:
    name: Test docs
    uses: ./.github/workflows/test-docs.yml

  release:
    name: Release
    needs: [verify, docs]
    uses: ./.github/workflows/release.yml
