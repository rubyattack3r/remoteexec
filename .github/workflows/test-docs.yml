name: Test docs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docusaurus:
    name: Docusaurus build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Check technique diagrams
        run: |
          for page in docs/techniques/*.md; do
            grep -q '^```mermaid$' "$page" || {
              echo "$page is missing a Mermaid diagram"
              exit 1
            }
          done
      - name: Build documentation
        run: |
          npm ci
          npm run build
