name: Test docs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Check technique diagrams
        run: |
          for page in docs/techniques/*.md; do
            grep -q '^```mermaid$' "$page" || {
              echo "$page is missing a Mermaid diagram"
              exit 1
            }
          done
      - name: Check local links
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import urllib.parse

          missing = []
          pages = [pathlib.Path("README.md"), *pathlib.Path("docs").rglob("*.md")]
          for page in pages:
              text = page.read_text(encoding="utf-8")
              for raw in re.findall(r"!?\[[^]]*\]\(([^)]+)\)", text):
                  target = raw.strip("<>").split("#", 1)[0].split("?", 1)[0]
                  if not target or "://" in target or target.startswith("mailto:"):
                      continue
                  resolved = (page.parent / urllib.parse.unquote(target)).resolve()
                  if not resolved.exists():
                      missing.append(f"{page}: {raw}")
          if missing:
              raise SystemExit("missing local Markdown links:\n" + "\n".join(missing))
          PY
