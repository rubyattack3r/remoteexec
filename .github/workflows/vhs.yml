name: VHS demo

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - docs/demo.tape
      - cmd/**
      - internal/**
      - main.go
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/vhs.yml

permissions:
  contents: write

concurrency:
  group: vhs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render terminal demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true
      - name: Build remoteexec
        run: |
          make build
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Render tape
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf
        with:
          path: docs/demo.tape
          version: v0.12.0
      - name: Commit generated demo
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d
        with:
          branch: develop
          commit_message: "docs: update VHS demo"
          file_pattern: docs/assets/demo.gif
          commit_user_name: vhs-action
          commit_user_email: actions@github.com
