# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: remoteexec

builds:
  - id: remoteexec
    main: ./cmd/remoteexec
    binary: remoteexec
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: remoteexec
    ids:
      - remoteexec
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else if eq .Os "linux" }}Linux
      {{- else }}{{ .Os }}{{ end }}-
      {{- if eq .Arch "amd64" }}64bit
      {{- else if eq .Arch "arm64" }}ARM64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - ACCEPTABLE_USE_POLICY.md

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

changelog:
  use: github-native

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: all
    output: true

sboms:
  - artifacts: archive
  - id: source
    artifacts: source

release:
  draft: false
